[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "irr-calculator"
version = "1.1.0"
description = "Local desktop portfolio tracker for Taiwan securities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.8",
    "SQLAlchemy>=2.0.45",
    "httpx>=0.28",
    "keyring>=25.6",
    "plotly>=6.3",
    "PyQt6-WebEngine>=6.8",
    "pyxirr>=0.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.16.3",
]

[project.scripts]
irr-calculator = "irr_calculator.app:main"

[tool.hatch.build.targets.wheel]
packages = ["irr_calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
